<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zen Shards Clone</title>
  </head>
  <body>
    <div id="app">
      
      <!-- Top Half: Game Canvas -->
      <div id="game-container">
        <!-- Mode Switcher (Floating Top Left) -->
        <button id="btn-toggle-mode" class="floating-btn">🔄 Modo: Arquería</button>
        <!-- Score / Currency (Floating Top Right) -->
        <div id="score-display">
          <span id="currency">0</span> 💎
        </div>
        
        <canvas id="gameCanvas"></canvas>
      </div>

      <!-- Bottom Half: UI Panels -->
      <div id="ui-container">
        
        <!-- Tabs Header -->
        <div class="tabs-header">
          <button class="tab-btn active" data-tab="tab-sparks">SPARKS</button>
          <button class="tab-btn" data-tab="tab-upgrades">UPGRADES</button>
          <button class="tab-btn" data-tab="tab-chaos" id="tab-chaos-btn" style="display:none;">CAOS</button>
        </div>

        <!-- Tab Content: Sparks (Archery Mode) -->
        <div id="tab-sparks" class="tab-content active">
          <div class="cards-grid">
            
            <!-- Card 1: Add Spark -->
            <div class="upgrade-card">
              <div class="card-icon">➤</div>
              <div class="card-info">
                <div class="card-title">SPARK</div>
                <div class="card-desc">Daño: <span id="stat-dmg">1.0</span></div>
              </div>
              <div class="card-actions">
                <button id="btn-add-spark" class="action-btn primary">
                  +1<br><small><span id="cost-spark">10</span> 💎</small>
                </button>
                <button id="btn-upg-spark" class="action-btn secondary">
                  Lvl Up<br><small><span id="cost-upg-spark">20</span> 💎</small>
                </button>
              </div>
            </div>

            <!-- Card 2: Merge Sparks -->
            <div class="upgrade-card">
              <div class="card-icon merge-icon">⪢</div>
              <div class="card-info">
                <div class="card-title">MERGE</div>
                <div class="card-desc">Sparks: <span id="stat-count">1</span></div>
              </div>
              <div class="card-actions">
                <button id="btn-merge-spark" class="action-btn primary full-width">
                  Fusionar<br><small>Requiere 2 Sparks</small>
                </button>
              </div>
            </div>

          </div>
        </div>

        <!-- Tab Content: Upgrades (Archery Mode) -->
        <div id="tab-upgrades" class="tab-content">
          <div class="cards-grid">
            <!-- Add future global upgrades here -->
            <div class="upgrade-card">
              <div class="card-info">
                <div class="card-title">SPAWN RATE</div>
                <div class="card-desc">Polígonos más rápidos</div>
              </div>
              <div class="card-actions">
                <button class="action-btn secondary disabled">Próximamente</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab Content: Chaos Controls (Bouncing Mode) -->
        <div id="tab-chaos" class="tab-content">
          <div class="cards-grid">
            
            <!-- Card: Add Ball -->
            <div class="upgrade-card">
              <div class="card-icon">🔵</div>
              <div class="card-info">
                <div class="card-title">AGREGAR PELOTA</div>
                <div class="card-desc">Pelotas: <span id="ball-count">0</span></div>
              </div>
              <div class="card-actions">
                <button id="btn-add-ball" class="action-btn primary full-width">+ Añadir</button>
              </div>
            </div>

            <!-- Card: Toggles -->
            <div class="upgrade-card">
              <div class="card-info" style="width: 100%;">
                <div class="toggle-row">
                  <span>Gravedad</span>
                  <label class="switch">
                    <input type="checkbox" id="toggle-gravity" checked>
                    <span class="slider round"></span>
                  </label>
                </div>
                <div class="toggle-row">
                  <span>Colisiones</span>
                  <label class="switch">
                    <input type="checkbox" id="toggle-collision">
                    <span class="slider round"></span>
                  </label>
                </div>
              </div>
            </div>

            <div class="upgrade-card">
              <button id="btn-clear-balls" class="action-btn danger full-width" style="height: 100%;">Limpiar Todo</button>
            </div>

          </div>
        </div>

      </div>

    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
